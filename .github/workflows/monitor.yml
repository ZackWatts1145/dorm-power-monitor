name: power-monitor

on:
  schedule:
    # 每 30 分钟一次（GitHub 的定时任务不保证准点，通常延迟几分钟）
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: power-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # 没配置 Secrets 时安静跳过，避免定时任务一直报失败
      - name: 检查配置
        id: guard
        env:
          ROOM_CODE: ${{ secrets.ROOM_CODE }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: |
          if [ -z "$ROOM_CODE" ] || [ -z "$SENDKEY" ]; then
            echo "未配置 ROOM_CODE / SENDKEY，跳过本次运行"
            echo "enabled=0" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          fi

      # 冷却状态和历史读数存在缓存里，跨运行保留
      - name: 恢复状态
        if: steps.guard.outputs.enabled == '1'
        uses: actions/cache@v4
        with:
          path: |
            state.json
            history.csv
          key: pm-state-${{ github.run_id }}
          restore-keys: |
            pm-state-

      - name: 生成配置
        if: steps.guard.outputs.enabled == '1'
        env:
          ROOM_CODE: ${{ secrets.ROOM_CODE }}
          SENDKEY: ${{ secrets.SENDKEY }}
          THRESHOLD_KWH: ${{ vars.THRESHOLD_KWH }}
        run: python bootstrap.py

      - name: 巡检
        if: steps.guard.outputs.enabled == '1'
        run: python monitor.py
